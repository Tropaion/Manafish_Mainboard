minimum_pre_commit_version: "4.3.0"
default_install_hook_types:
  - pre-commit
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: bash -c 'cd software && uv run ruff check --fix --exit-non-zero-on-fix'
        language: system
        pass_filenames: false
        files: ^software/
      - id: ruff-format
        name: ruff format
        entry: bash -c 'cd software && uv run ruff format'
        language: system
        pass_filenames: false
        files: ^software/
      - id: ty
        name: ty check
        entry: bash -c 'cd software && uv run ty check'
        language: system
        pass_filenames: false
        files: ^software/
  - repo: https://github.com/pre-commit/mirrors-clang-format
    # v19 matches the LLVM 19 format baseline in firmware/flake.nix.
    rev: v19.1.7
    hooks:
      - id: clang-format
        types_or: [c]
        files: ^firmware/
        exclude: ^firmware/(third_party|tests/unity)/
