name: Software CI

on:
  push:
    branches:
      - main
    paths:
      - "software/**"
      - "firmware/src/control/**"
      - ".github/workflows/software-ci.yml"
  pull_request:
    branches:
      - main
    paths:
      - "software/**"
      - "firmware/src/control/**"
      - ".github/workflows/software-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: software

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          working-directory: software
      - name: Install dependencies
        run: uv sync
      - name: Run ruff linter
        run: uv run ruff check --no-fix
      - name: Run ruff formatter check
        run: uv run ruff format --check
      - name: Run ty type check
        run: uv run ty check
      - name: Run tests
        # The path makes the C-vs-Python differential test run instead of skip.
        env:
          PICO_CONTROLLER_SOURCE: ${{ github.workspace }}/firmware/src/control/controller.c
        run: uv run pytest

  nix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      - uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15
        with:
          # No FlakeHub account; the GitHub Actions cache is enough.
          use-flakehub: false
      - name: Check formatting (alejandra, statix, deadnix)
        run: nix fmt -- --ci .
      - name: Validate flake
        run: nix flake check --show-trace
      - name: Evaluate the SD image (dry-run)
        run: nix build --accept-flake-config --dry-run .#sdImage
      - name: Verify dependency sync is a no-op
        run: |
          ./sync-python-deps.sh
          nix develop --command uv lock
          git diff --exit-code -- pyproject.toml uv.lock
